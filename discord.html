    <!-- Fonts & Base Style -->

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Space+Grotesk:wght@600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-color: #0a0d0f;
            --accent: #5865F2; /* Discord Blurple */
            --accent-glow: rgba(88, 101, 242, 0.25);
            --cyan: #00f2fe;
            --text-primary: #ffffff;
            --text-secondary: #9aa8b6;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-primary);
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 24px;
            overflow: hidden;
            position: relative;
        }

        .bg-glow {
            position: absolute;
            width: 500px;
            height: 500px;
            background: radial-gradient(circle, var(--accent-glow) 0%, transparent 70%);
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            filter: blur(60px);
            z-index: 1;
            pointer-events: none;
        }

        .redirect-card {
            position: relative;
            z-index: 2;
            background: rgba(18, 24, 28, 0.85);
            border: 1px solid rgba(88, 101, 242, 0.3);
            border-radius: 20px;
            padding: 48px 36px;
            max-width: 480px;
            width: 100%;
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5), 0 0 30px var(--accent-glow);
            animation: fadeIn 0.4s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px) scale(0.98); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        .discord-icon {
            width: 64px;
            height: 64px;
            fill: var(--accent);
            margin-bottom: 20px;
            filter: drop-shadow(0 0 12px var(--accent-glow));
            animation: pulse 2s infinite ease-in-out;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.06); }
        }

        h1 {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 8px;
            letter-spacing: -0.02em;
        }

        p {
            color: var(--text-secondary);
            font-size: 14px;
            line-height: 1.5;
            margin-bottom: 28px;
        }

        .spinner {
            display: inline-block;
            width: 24px;
            height: 24px;
            border: 3px solid rgba(88, 101, 242, 0.2);
            border-radius: 50%;
            border-top-color: var(--accent);
            animation: spin 0.8s linear infinite;
            margin-bottom: 20px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .btn-discord {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            width: 100%;
            background-color: var(--accent);
            color: #ffffff;
            text-decoration: none;
            padding: 14px 24px;
            border-radius: 12px;
            font-weight: 600;
            font-size: 15px;
            transition: all 0.2s ease;
            box-shadow: 0 4px 20px rgba(88, 101, 242, 0.4);
        }

        .btn-discord:hover {
            background-color: #4752c4;
            transform: translateY(-2px);
            box-shadow: 0 6px 25px rgba(88, 101, 242, 0.6);
        }

        .back-link {
            display: block;
            margin-top: 18px;
            font-size: 12px;
            color: var(--text-secondary);
            text-decoration: none;
            font-family: 'JetBrains Mono', monospace;
            transition: color 0.2s ease;
        }

        .back-link:hover {
            color: var(--cyan);
        }
    </style>

    <!-- Instant JS Redirect -->
    <script>
        const DISCORD_INVITE = "https://discord.gg/SzNngQ8R9w";
        // Immediate redirect
        window.location.replace(DISCORD_INVITE);
    </script>
</head>

        <div class="spinner"></div>
